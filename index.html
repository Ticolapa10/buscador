<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/17734/17734786.png" type="image/png">

  <style>
    /* ---------- PALETA “DARK-BLUE” ---------- */
    :root{
      --bg:#0d1b2a;
      --bg-grad:linear-gradient(135deg,#0d1b2a 0%,#152538 35%,#1e3246 65%,#29425b 100%);
      --text:#e9eef4;
      --subtext:#c0c9d6;
      --input-bg:#1a2738;
      --input-border:#304760;
      --btn-bg:#3a6ef7;
      --btn-hover:#2f55c7;
    }

    /* ---------- LAYOUT GERAL ---------- */
    html,body{height:100%;margin:0;}
    body{
      font-family:"Segoe UI",Arial,sans-serif;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      background:var(--bg-grad);color:var(--text);
      animation:fadeIn .8s ease-in;
    }

    @keyframes fadeIn{
      from{opacity:0;transform:translateY(20px);}
      to  {opacity:1;transform:translateY(0);}
    }

    /* TÍTULO — garantimos centralização real */
    h1{
      width:100%;                 /* ocupa toda a largura do viewport            */
      max-width:700px;            /* evita ficar exagerado em telas grandes       */
      margin:0 0 24px;            /* espaço inferior apenas                       */
      padding:0 1rem;             /* respiro lateral em mobile                    */
      font-weight:600;
      font-size:1.75rem;
      line-height:1.3;
      text-align:center;          /* texto CENTRALIZADO, inclusive em quebras    */
      text-shadow:0 2px 4px rgba(0,0,0,.45);
      animation:fadeIn .8s ease-in .05s both;
      box-sizing:border-box;      /* respeita o padding no cálculo de largura    */
    }

    /* --------- CAMPOS --------- */
    input{
      width:320px;max-width:90vw;
      padding:11px 14px;font-size:16px;
      border:1px solid var(--input-border);
      border-radius:6px;
      background:var(--input-bg);color:var(--text);
      outline:none;
      transition:border-color .2s,box-shadow .2s;
      animation:fadeIn .8s ease-in .15s both;
    }
    input:focus{
      border-color:var(--btn-bg);
      box-shadow:0 0 0 3px rgba(58,110,247,.25);
    }

    button{
      margin-top:14px;
      padding:11px 28px;
      font-size:16px;font-weight:600;
      border:none;border-radius:6px;
      background:var(--btn-bg);color:#fff;
      cursor:pointer;
      transition:background .25s,transform .15s;
      animation:fadeIn .8s ease-in .25s both;
    }
    button:hover {background:var(--btn-hover);}
    button:active{transform:scale(.97);}

    /* ---------- RESPONSIVIDADE (mobile-first) ---------- */
    @media (max-width:480px){
      h1{
        font-size:1.5rem;         /* escala na mão para caber direitinho         */
        margin-bottom:22px;
      }
      input,button{
        width:calc(100vw - 2rem);
        max-width:400px;
      }
      input {font-size:17px;}
      button{
        font-size:17px;
        padding:13px 0;
      }
    }

    @media (min-width:1200px){
      h1{font-size:2rem;}
      input,button{font-size:17px;}
    }
  </style>
</head>

<body>
  <h1>Buscador de Vídeos&nbsp;(20&nbsp;min+)</h1>

  <input  id="searchInput"
          type="text"
          placeholder="Digite sua busca..."
          autofocus
          autocomplete="off">

  <button onclick="buscar()">Buscar</button>

  <script>
    const input=document.getElementById('searchInput');

    function buscar(){
      const termo=input.value.trim();
      if(!termo){
        alert('Digite algo para buscar!');
        return;
      }
      const query=encodeURIComponent(termo).replace(/%20/g,' ');
      const url=`https://www.google.com/search?q=${query}&udm=7&tbs=dur:l`;
      window.location.href=url;
    }

    input.addEventListener('keydown',e=>{
      if(e.key==='Enter') buscar();
    });
  </script>
</body>
</html>
